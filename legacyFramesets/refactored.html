<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>レガシーフレームサイト</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .grid-container {
            display: grid;
            grid-template-rows: 100px 1fr 50px;
            width: 100vw;
            height: 100vh;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        .frame-header,
        .frame-footer {
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="frame-header">
            <iframe src="header.html" name="header"></iframe>
        </div>
        <div>
            <iframe src="content.html" name="content"></iframe>
        </div>
        <div class="frame-footer">
            <iframe src="footer.html" name="footer"></iframe>
        </div>
    </div>
</body>
</html>
